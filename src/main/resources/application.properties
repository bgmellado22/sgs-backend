spring.application.name=sgs-backend

# Servidor y Puerto dinámico para Railway
server.port=${PORT:8080}

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Seguridad JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Configuración SMTP (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:sgs.eltabo.soporte@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configuración de Mongock
mongock.migration-scan-package=com.conectatech.migration

# Configuración de Swagger
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs

# Configuración de Carga de Archivos Multipart (Máximo 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ===================================================================
# CONFIGURACIÓN CLAVEÚNICA (GOBIERNO DIGITAL)
# ===================================================================
claveunica.mode=${CLAVEUNICA_MODE:mock}
claveunica.client-id=${CLAVEUNICA_CLIENT_ID:mock_el_tabo_client_id}
claveunica.client-secret=${CLAVEUNICA_CLIENT_SECRET:mock_el_tabo_client_secret}
claveunica.redirect-uri=${CLAVEUNICA_REDIRECT_URI:http://localhost:5173/auth/claveunica/callback}
claveunica.token-url=https://accounts.claveunica.gob.cl/openid/token/
claveunica.userinfo-url=https://accounts.claveunica.gob.cl/openid/userinfo/
claveunica.logout-url=https://accounts.claveunica.gob.cl/api/v1/accounts/app/logout
